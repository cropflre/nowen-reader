name: Publish Nowen Reader v1.2.4 (one-shot)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.2.4.yml

permissions:
  contents: write
  actions: write

jobs:
  publish:
    if: github.repository == 'cropflre/nowen-reader' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source version and publish target
        run: |
          grep -qx 'version: 1.2.4+5' flutter_app/pubspec.yaml
          test -f .github/workflows/build.yml
      - name: Create immutable v1.2.4 source tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GH_REPO/git/ref/tags/v1.2.4" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            test "$existing" = "$COMMIT" || { echo 'Existing v1.2.4 tag points elsewhere'; exit 1; }
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref='refs/tags/v1.2.4' -f sha="$COMMIT"
          fi
      - name: Trigger signed Android and multiarch Docker stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run build.yml --repo "$GH_REPO" --ref v1.2.4 \
            -f version=1.2.4 -f publish=true
