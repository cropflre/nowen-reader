name: Android API Sync Check

on:
  pull_request:
    branches:
      - main
    paths:
      - internal/handler/**
      - internal/store/**
      - flutter_app/**
      - .github/workflows/android-api-sync-check.yml

permissions:
  contents: read

jobs:
  go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Run compatibility store tests
        run: go test ./internal/store -run 'Test(GetExpandedGroupedComicIDsIncludesDirectorySeries|GetAllComicsSortedByPageCountPaginatesAfterSorting)$' -count=1

  flutter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Run API model contract tests
        run: flutter test test/data/models/comic_model_test.dart
