name: Validate large PDF optimization

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare frontend embed placeholder
        run: |
          mkdir -p web/dist
          printf '<!doctype html><title>validation</title>' > web/dist/index.html
      - run: go vet ./...
      - name: Test PDF range and capture diagnostics
        id: backend-test
        shell: bash
        run: |
          set +e
          go test ./internal/handler -run 'TestServePDFRangeContent' -count=1 -v > pdf-range-test.log 2>&1
          status=$?
          cat pdf-range-test.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-range-test-log
          path: pdf-range-test.log
      - run: go build -o /tmp/nowen-reader-server ./cmd/server
      - name: Verify PDF range tests
        if: always()
        run: test "${{ steps.backend-test.outputs.status }}" = "0"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build frontend and capture diagnostics
        id: frontend-build
        shell: bash
        run: |
          set +e
          npm run build > frontend-build.log 2>&1
          status=$?
          cat frontend-build.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-pdf-frontend-build-log
          path: frontend/frontend-build.log
      - name: Verify stable worker
        if: always()
        run: |
          test "${{ steps.frontend-build.outputs.status }}" = "0"
          test -f dist/assets/pdf.worker.min.mjs
