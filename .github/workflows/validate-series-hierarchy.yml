name: Validate comic series hierarchy

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run focused backend tests
        run: go test ./internal/store ./internal/service ./internal/handler
      - name: Build server and capture diagnostics
        id: server-build
        shell: bash
        run: |
          set +e
          go build -o /tmp/nowen-reader-server ./cmd/server > server-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat server-build.log
          exit 0
      - name: Upload server build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-build-diagnostics
          path: server-build.log
          if-no-files-found: error
      - name: Verify server build
        if: always()
        run: test "${{ steps.server-build.outputs.status }}" = "0"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck and build frontend
        run: npm run build
