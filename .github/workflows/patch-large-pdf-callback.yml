name: Patch large PDF progress callback

on:
  push:
    branches: [perf/large-pdf-fast-open]
    paths:
      - .github/workflows/patch-large-pdf-callback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/large-pdf-fast-open
      - name: Add explicit PDF.js progress type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/components/reader/PdfViewOptimized.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'loadingTask.onProgress = ({ loaded }) => {'
          new = 'loadingTask.onProgress = ({ loaded }: { loaded: number; total: number }) => {'
          if old not in text:
              raise SystemExit('target callback was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/components/reader/PdfViewOptimized.tsx
          git commit -m "fix: 标注 PDF.js 加载进度回调类型 (#19)"
          git push origin HEAD:perf/large-pdf-fast-open
