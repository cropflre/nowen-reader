name: Validate PDF worker fix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet and capture diagnostics
        id: vet
        shell: bash
        run: |
          set +e
          go vet ./... > go-vet.log 2>&1
          status=$?
          cat go-vet.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload vet diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-worker-go-vet
          path: go-vet.log
          if-no-files-found: error
      - name: Test SPA handler
        run: go test ./internal/handler -run 'TestSPAHandler' -count=1
      - name: Verify vet
        if: always()
        run: test "${{ steps.vet.outputs.status }}" = "0"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Verify stable PDF worker output
        run: |
          test -f dist/assets/pdf.worker.min.mjs
          test "$(find dist/assets -maxdepth 1 -type f -name 'pdf.worker*.mjs' | wc -l)" -eq 1
