services:
  nowen-reader:
    image: {{IMAGE}}
    container_name: nowen-reader
    restart: unless-stopped
    ports:
      - "${TRIM_SERVICE_PORT:-6680}:3000"
    volumes:
      - "${TRIM_PKGVAR:?fnOS application data directory is required}/data:/data"
      - "${TRIM_PKGVAR:?fnOS application data directory is required}/cache:/app/.cache"
      # Exactly one data-share is declared in config/resource.
      - "${TRIM_DATA_SHARE_PATHS:?fnOS shared book directory is required}:/library"
    environment:
      GIN_MODE: release
      PORT: "3000"
      DATABASE_URL: /data/nowen-reader.db
      COMICS_DIR: /library/comics
      NOVELS_DIR: /library/novels
      DATA_DIR: /app/.cache
      PUID: "${TRIM_UID:?fnOS application UID is required}"
      PGID: "${TRIM_GID:?fnOS application GID is required}"
      UMASK: "0002"
      PERMISSION_FIX_MODE: auto
      TZ: Asia/Shanghai
