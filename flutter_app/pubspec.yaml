name: nowen_reader
description: NowenReader Flutter 客户端 — 漫画/小说阅读器
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 网络请求
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # 路由
  go_router: ^14.2.0
  # 图片缓存
  cached_network_image: ^3.3.1
  # 本地存储
  shared_preferences: ^2.2.3
  # UI 工具
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  photo_view: ^0.15.0
  # EPUB 图文正文
  flutter_widget_from_html_core: ^0.17.4
  flutter_svg: ^2.0.10+1
  html: ^0.15.4
  # PDF 阅读（支持 Android/iOS/Windows/macOS/Linux/Web）
  pdfrx: ^2.2.24
  # 工具
  intl: ^0.20.2
  timeago: ^3.6.1
  url_launcher: ^6.2.5
  path_provider: ^2.1.5
  # 文件选择（上传功能）
  file_picker: ^8.0.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
